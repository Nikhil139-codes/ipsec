<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPsec Testbed Control Panel</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --success: #10b981;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-col; gap: 20px; }
header { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; }
h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
header p { font-size: 13px; color: var(--muted); }
.status { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 20px; background: rgba(59, 130, 246, 0.1); color: var(--primary); border: 1px solid rgba(59, 130, 246, 0.2); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
select { background: #0b1120; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
select:focus { border-color: var(--primary); }
.actions { display: flex; justify-content: flex-end; gap: 12px; }
button { padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text); transition: 0.15s; }
button:hover { background: rgba(255,255,255,0.05); }
button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
button.primary:hover { background: var(--primary-hover); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
pre { background: #070d19; border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: monospace; font-size: 12px; overflow-x: auto; max-height: 350px; color: #38bdf8; }
.download-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 16px; border-radius: 8px; margin-bottom: 16px; display: none; justify-content: space-between; align-items: center; }
.download-btn { background: var(--success); border-color: var(--success); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>IPsec Testbed Control Panel</h1>
    <p>Configure → establish VPN → generate traffic → capture PCAP</p>
  </div>
  <div id="status" class="status">Checking Docker…</div>
</header>

<section class="card">
<h2>IPsec Configuration</h2>
<div class="grid">
<label>Mode<select id="mode"><option value="tunnel">Tunnel</option><option value="transport">Transport</option></select></label>
<label>IKE Version<select id="ike_version"><option value="ikev2">IKEv2</option></select></label>
<label>Encryption<select id="encryption"><option value="aes128">AES-128</option><option value="aes256">AES-256</option><option value="aes-gcm">AES-GCM</option></select></label>
<label>Integrity<select id="integrity"><option value="sha256">SHA-256</option><option value="sha384">SHA-384</option><option value="sha512">SHA-512</option></select></label>
<label>DH Group<select id="dh_group"><option value="modp2048">MODP-2048</option><option value="modp3072">MODP-3072</option><option value="modp4096">MODP-4096</option></select></label>
<label>PFS<select id="pfs"><option value="true">Enabled</option><option value="false">Disabled</option></select></label>
<label>IP Version<select id="ip_version"><option value="ipv4">IPv4</option><option value="ipv6">IPv6</option></select></label>
<label>Traffic<select id="traffic_type"><option value="icmp">ICMP</option><option value="web">Web</option><option value="video">Video</option><option value="voip">VoIP</option><option value="email">E-mail</option></select></label>
</div>
<div class="actions">
<button id="save">Save Configuration</button>
<button id="run" class="primary">Run Experiment</button>
</div>
</section>

<div id="download-box" class="download-box">
  <div>
    <strong style="color: #34d399; display: block;">Experiment Finished & PCAP Captured!</strong>
    <span id="pcap-name" style="font-size: 13px; color: var(--muted);">run_001.pcap</span>
  </div>
  <a id="download-link" class="download-btn" href="#" download>⬇ Download PCAP File</a>
</div>

<section class="card">
<h2>Experiment Output</h2>
<pre id="output">No experiment started.</pre>
</section>
</div>

<script>
const ids = ["mode", "ike_version", "encryption", "integrity", "dh_group", "pfs", "ip_version", "traffic_type"];
const $ = id => document.getElementById(id);
const output = $("output");
const API_BASE = "http://localhost:8000";

function config() {
  return Object.fromEntries(ids.map(id => [id, $(id).value]));
}

function setConfig(c) {
  ids.forEach(id => {
    if (c[id] !== undefined) $(id).value = c[id];
  });
}

async function api(url, opts = {}) {
  const r = await fetch(`${API_BASE}${url}`, {
    headers: { "Content-Type": "application/json" },
    ...opts
  });
  let d;
  try {
    d = await r.json();
  } catch {
    throw new Error(`Invalid response (${r.status})`);
  }
  if (!r.ok) {
    throw new Error(d.error || d.detail || `Request failed (${r.status})`);
  }
  return d;
}

async function load() {
  try {
    const c = await api("/api/testbed/config");
    setConfig(c);
  } catch (e) {
    output.textContent = "Config error: " + e.message;
  }

  try {
    const d = await api("/api/testbed/status");
    if (d.containers && Object.keys(d.containers).length) {
      $("status").textContent = Object.entries(d.containers).map(([n, s]) => `${n}: ${s}`).join(" | ");
      $("status").style.color = "#34d399";
    } else {
      $("status").textContent = "Docker unavailable";
    }
  } catch (e) {
    $("status").textContent = "Backend/Docker unavailable";
  }
}

$("save").onclick = async () => {
  try {
    const d = await api("/api/testbed/config", {
      method: "POST",
      body: JSON.stringify(config())
    });
    output.textContent = JSON.stringify(d, null, 2);
  } catch (e) {
    output.textContent = e.message;
  }
};

$("run").onclick = async () => {
  $("run").disabled = true;
  $("download-box").style.display = "none";
  output.textContent = "Running experiment in Docker / WSL...";
  try {
    const d = await api("/api/testbed/run", {
      method: "POST",
      body: JSON.stringify({ config: config() })
    });
    output.textContent = JSON.stringify(d, null, 2);
    if (d.ok && d.run_id) {
      $("download-box").style.display = "flex";
      $("pcap-name").textContent = `${d.run_id}.pcap (${d.config.traffic_type} / ${d.config.mode})`;
      $("download-link").href = `${API_BASE}/api/testbed/download/${d.run_id}`;
    }
  } catch (e) {
    output.textContent = e.message;
  } finally {
    $("run").disabled = false;
  }
};

load();
</script>
</body>
</html>
